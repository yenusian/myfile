<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site</title>
    <script>
        //Task 1
        let a = prompt("Number: ");
        if (a > 10) {
            console.log("Число больше 10");
        } else {
            console.log("Число меньше или равно 10");
        }
        
        //Task 2
        let confirmDeletion = confirm("Вы уверены, что хотите удалить?");
        if (confirmDeletion) {
            console.log("Файл удален");
        } else {
            console.log("Удаление отменено");
        }

        //Task 3
        let userAge = prompt("Напишите ваш возраст: ");
        if (userAge < 0){
            userAge = prompt("Напишите ваш возраст (положительное число): ");
        }

        if (userAge < 18) {
            console.log("Вы еще подросток");
        } else if (userAge >= 18 && userAge <= 30) {
            console.log("Вы молодой взрослый");
        } else {
            console.log("Вы взрослый");
        }
        

        //Task 4
        let num = prompt("Напишите число: ");
        let evenOddCheck = (num%2==0) ? "Четное число" : "Нечетное число"; 
        console.log(evenOddCheck);  

        //Task 5
        let weekDay = prompt("Введите день недели(1-7):");
        let weekDayNum = Number(weekDay);
        let message;

        switch(weekDayNum) {
            case 1:
                message = "Понедельник";
                break;
            case 2:
                message = "Вторник";
                break;
            case 3:
                message = "Среда";
                break;
            case 4:
                message = "Четверг";
                break;
            case 5:
                message = "Пятница";
                break;
            case 6:
                message = "Суббота";
                break;
            case 7:
                message = "Воскресенье";
                break;
            default:
                message = "Некорректное значение";
        }

        console.log(message);

        //Task 6
        let input1 = prompt("Введите первое число:");
        let input2 = prompt("Введите второе число:");

        let num1 = Number(input1);
        let num2 = Number(input2);

        if (isNaN(num1) || isNaN(num2) || input1 === null || input2 === null) {
            console.log("Ошибка: введите корректные числа");
        } else if (num1 == num2) {
            console.log("Числа равны");
        } else {
            let res = (num1 > num2) ? "Первое число больше" : "Второе число больше";
            console.log(res);
        }

        //Task 7 (additional)
        const input = prompt("Введите номер месяца (от 1 до 12):");
        const month = Number(input);

        switch (month) {
            case 12:
            case 1:
            case 2:
                console.log("Зима");
                break;

            case 3:
            case 4:
            case 5:
                console.log("Весна");
                break;

            case 6:
            case 7:
            case 8:
                console.log("Лето");
                break;

            case 9:
            case 10:
            case 11:
                console.log("Осень");
                break;

            default:
                console.log("Ошибка: Введите число от 1 до 12");
                break;
        }
        
    </script> 
</head>
<body>
    <h2>if-else</h2>
</body>
</html>
